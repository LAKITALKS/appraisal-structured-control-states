# ASCR pilot configuration (v0.1.1 pre-data amendment).
#
# This file records the intended pilot configuration. No data have been
# collected. The exact immutable model revision hash MUST be recorded in
# `model.revision` before any activations are extracted; until then it holds the
# sentinel value below and no data generation may proceed.

config_version: "0.1.1"

# Study staging and run gate (v0.1.1, 2nd pass). These fields are machine-readable
# so a validation gate can block a real run while placeholders remain. No spurious
# precision or result values are entered here.
study_stage: feasibility          # feasibility | pilot | confirmatory
validation_mode: draft            # draft (no extraction) | run_ready
mini_shard_id: ASCR-Mini-0        # active shard for this config
target_matched_groups: 40         # feasibility floor for Mini-0 (not a power analysis)
no_holonomy_data: true            # ASCR shards collect no holonomy/loop/user-signature data
axis_isolation_required: true     # primary matched groups manipulate one axis only
external_label_review_required: true  # external labels need human-reviewed provenance
temperature_zero_generation_policy:
  primary_temperature: 0.0
  deterministic_single_generation: true
  seeds_are_independent_text_samples: false
  seeds_govern:
    - matched_group_splits
    - probe_initialization_or_solver
    - random_direction_controls
    - bootstrap
    - numerical_nondeterminism
  sampling_robustness_temperature_gt_zero: secondary_separately_frozen

model:
  # Open-weight, instruction-tuned model in the ~7B-9B range.
  name: "Qwen/Qwen2.5-7B-Instruct"
  # Immutable revision (commit hash) of the model weights. Freeze before data gen.
  revision: "TO_BE_FROZEN_BEFORE_DATA_GENERATION"
  # Replication model MUST differ from the primary model (v0.1.1 amendment).
  # Held as a placeholder until a documented, compatibility-checked choice is made.
  replication_model: "TO_BE_SELECTED_BEFORE_CONFIRMATORY_REPLICATION"
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 256
    seed: 0

design:
  # Primary, load-bearing axes for the pilot.
  axes:
    - uncertainty
    - norm_tension
    - controllability
  # Exploratory axes are documented but not part of the primary analysis.
  exploratory_axes:
    - signed_relevance
    - goal_congruence
    - response_pressure
  domains:
    - software_debugging
    - scheduling_planning
    - policy_constrained_assistance
    - document_editing
  # Held-out domain for the leave-one-domain-out transfer test.
  held_out_domain: document_editing
  cells:
    - A_neutral_control
    - B_concept_tracking_only
    - C_pure_task_induction
    - D_combined
  # Pilot target counts (feasibility pilot, not a powered study).
  matched_groups_per_axis: 24
  target_total_items: 350

# Two-tier response-strategy analysis (v0.1.1 amendment).
response_strategy:
  primary_superclasses:
    - direct_or_comply
    - qualify_or_warn
    - redirect_or_clarify
    - decline_or_abstain
  secondary: fine_grained_nine_labels

activations:
  # Record residual-stream activations; keep token position, layer, and
  # prompt-vs-generated flags distinct.
  layers: "all"           # or a preregistered subset if compute-limited
  prompt_final_token: true
  early_generated_tokens: 4

analysis:
  probes:
    - logistic_regression
    - ridge_regression
    - linear_discriminant_analysis
  # Primary intervention-direction rule (v0.1.1 amendment).
  primary_decoder: logistic_regression
  primary_direction: difference_in_means_task_state_present_minus_absent
  split_level: matched_group
  transfer: leave_one_domain_out
  nested_cv: true
  # H1 primary metric is balanced accuracy on deconfounded cells; the family test
  # (below) uses held-out log-loss as its primary metric.
  primary_metric: held_out_log_loss
  h1_primary_metric: balanced_accuracy_deconfounded_cells
  seeds: [0, 1, 2, 3, 4]
  bootstrap_resamples: 1000
  multiple_comparison_correction: benjamini_hochberg
  # Primary baselines the task-state representation must beat (v0.1.1 amendment).
  primary_baselines:
    - prompt_embedding
    - difficulty_representation
    - prompt_length
    - token_entropy
    - lexical_bag_of_words
    - matched_norm_random_subspace
    - pca_subspace

# Family-structure test (v0.1.1 amendment): the family claim requires A AND B AND C.
# See preregistration/analysis-plan.md section 6b.
family_structure_test:
  require_all_of: [A_shared_vs_separate, B_behavioral_specificity, C_incremental]
  shared_low_rank_vs_separate: true
  structured_behavioral_specificity: true
  incremental_shared_contribution: true
  min_axes_before_family_claim: 2
  # Rank grid: primary r in {1,2} for three axes; r=3 secondary sensitivity only;
  # r=1 admissible with two axes. Rank/regularization chosen in the inner CV loop.
  family_rank_grid: [1, 2]
  family_rank_grid_secondary: [3]
  primary_metric: pooled_held_out_log_loss
  decision_rule: paired_matched_group_bootstrap_ci_below_zero_after_fdr
  arbitrary_margin: none

# Concept-mention QA thresholds enforced by the run-ready gate (ascr.schema).
qa_thresholds:
  min_naturalness_rating: 4
  max_within_group_naturalness_spread: 1
  required_disposition: pass
  naturalness_scale: [1, 5]

intervention:
  methods:
    - activation_addition
    - directional_ablation
    - counter_steering
  controls:
    - matched_norm_random_direction
    - pca_direction
  strengths: [0.5, 1.0, 2.0, 4.0]
  layers: "subset"
  seeds: [0, 1, 2, 3, 4]

# Modular mini-shard pilot protocol (v0.1.1 amendment). Each shard tests a single
# axis and carries an immutable run manifest; shards combine only if all
# compatibility-relevant manifest fields are identical. Feasibility studies only —
# no arbitrary success/failure thresholds. Mini-0/1/2 collect NO holonomy,
# dialogue-loop, path-dependence, or user-signature data.
mini_shards:
  - id: ASCR-Mini-0
    axis: uncertainty
    kind: feasibility
    goal: pipeline_stimulus_and_H1_feasibility
    readout: prompt_final_token
    full_steering_sweep: false
    target_matched_groups: 40
    no_holonomy_data: true
  - id: ASCR-Mini-1
    axis: norm_tension
    kind: feasibility
    no_holonomy_data: true
  - id: ASCR-Mini-2
    axis: controllability
    kind: feasibility
    no_holonomy_data: true
