[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascr"
version = "0.1.0"
description = "Design-time scaffold for the Appraisal-Structured Latent Control Representations (ASCR) preregistered pilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lazaros Varvatis", email = "varvatislazaros@gmail.com" }]
keywords = [
    "mechanistic-interpretability",
    "representation-engineering",
    "activation-steering",
    "latent-control-representation",
    "response-strategy",
    "task-induction",
    "appraisal-structure",
    "language-models",
    "ai-safety",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/LAKITALKS/appraisal-structured-control-states"

[tool.setuptools]
package-dir = { "" = "experiments/src" }

[tool.setuptools.packages.find]
where = ["experiments/src"]

[tool.pytest.ini_options]
pythonpath = ["experiments/src"]
testpaths = ["tests"]
